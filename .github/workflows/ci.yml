name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

# 同一 ref で進行中の run は新しい push で打ち切る（ランナー節約・フィードバック高速化）
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 単調増加検証（ADR-0031）の baseline は直近の git タグ。既定の checkout は
          # タグを取得しないため明示取得する（shallow のまま tag refs だけ足す＝軽い）。
          fetch-tags: true

      # 変更が docs だけか判定（ADR-0028）。docs-only は重い検査を skip し lint/format だけにする。
      # 必須チェックなので job 自体は常に走り報告する（paths-ignore は使わない＝"Expected" 詰み回避）。
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: changes
        with:
          # "every": ファイルが全パターンを満たすときだけ該当（= 非 md かつ 非 docs）。
          # 既定の "some" だと否定パターンの OR で全ファイルが該当し常に true になるため必須。
          predicate-quantifier: "every"
          filters: |
            code:
              - "!**/*.md"
              - "!docs/**"

      # pnpm を先に入れる（setup-node の cache: pnpm が pnpm を要求するため）
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # 整形・lint は docs PR でも常時（docs-only の「lint だけ」はここ）
      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      # ドキュメント・リリース・シェルの検査を**まとめて**走らせる（RV-42）。
      # `pnpm check` は `package.json` の `check:*` をパターンで束ねたもの＝**一覧はここに
      # 写さない**。個別のステップに並べると、検査を足したときに CI だけ古くなる
      # （実際 `check:docs` / `check:links` / `check:api` は各所の一覧から漏れていた）。
      # `check:publish` と `check:cjs` だけは `dist` を見るので束ねず、build の後で回す。
      #
      # 中身と、いずれも**コード変更の有無に関わらず常時実行**する理由:
      #   check:release  リリース連動文書の整合（ADR-0027）。README/CHANGELOG の変更も拾う
      #   check:index    索引（docs/adr/index.md ほか）と本文メタ行の突合（ADR-0053 / ADR-0052）。
      #                  索引の更新は docs-only PR で起きる
      #   check:links    md のリンク先と見出しアンカーの実在。MD052 は「ラベル未定義」しか
      #                  見ない。ADR-0070 の移設で実際に壊れた
      #   check:docs     README / ガイドの TS コード例が今の公開 API でコンパイルするか
      #                  （ADR-0070 検査④）。`new PortersClient({ …, partition })` は
      #                  0.10.0 以来 19 日間壊れていた
      #   check:mentions 公開記号が入門か目的別のどこかから辿れるか（ADR-0070 検査③）
      #   check:api      docs/usage/api（TypeDoc 生成物）が今のソースと一致するか（ADR-0068）。
      #                  JSDoc だけの変更でも差分が出る
      #   check:shell    シェルの `$var` に全角文字が吸われる箇所（.sh と workflows の YAML）。
      #                  「報告せず死ぬ」形で壊れるため（実際に 2 度発生）
      - name: Checks (docs / release / shell)
        run: pnpm check

      # シェルの静的解析。上の check:shell（全角の吸い込み）とは別物で、こちらは
      # クォート漏れ・未定義参照・パイプの終了ステータスなど一般的な bash の壊れ方を見る。
      # .sh は docs-only の PR でも変わりうるので code フィルタ配下に置かず**常時実行**する。
      # 手元で回すなら: git ls-files -z '*.sh' | xargs -0 pnpm dlx shellcheck -x -s bash -S warning
      # （npm の shellcheck ラッパーは版を指定してもバイナリは最新を取ってくるので、
      #   手元とランナーで版が違いうる。下の理由により、それでよい）
      - name: Shellcheck
        run: |
          # shellcheck は ubuntu ランナーに同梱されている（ubuntu-latest = Ubuntu 24.04、
          # 同梱は 0.9.0。2026-09-06 に runner-images の同梱一覧と、その 0.9.0 を実際に
          # 落として全 .sh に当てた結果の両方で確認済み）。
          # 版はイメージ更新で上がりうるが**固定しない** — 固定したいのは検査の下限であって
          # 特定の版ではない。新しい shellcheck は検査が増えるだけなので下限は下がらず、
          # 版が上がって赤くなったならそれは本物の指摘。
          # 無いときに黙って飛ばすと「検査したつもりで一度も走っていない」状態になるので、
          # 存在しなければ明示的に落とす。
          command -v shellcheck > /dev/null || {
            echo "::error::shellcheck が見つかりません（ランナー同梱物の変更を疑うこと）。" >&2
            exit 1
          }
          files=$(git ls-files '*.sh')
          if [ -z "${files}" ]; then
            echo "::error::検査対象の .sh が 1 つも見つかりません。検査が空振りしています。" >&2
            exit 1
          fi
          shellcheck --version
          # -x で source 先まで解決する。info（SC2016 等）は落とさず warning 以上を見る。
          # NUL 区切りで渡す。改行区切りだと空白を含むファイル名で単語分割される
          # （`-0` は GNU / BSD どちらの xargs にもあるので手元でも同じ形で回せる）。
          git ls-files -z '*.sh' | xargs -0 shellcheck -x -s bash -S warning

      # 以下はコード変更時のみ（docs-only は skip）
      - name: Typecheck
        if: steps.changes.outputs.code == 'true'
        run: pnpm typecheck

      - name: Test (coverage)
        if: steps.changes.outputs.code == 'true'
        run: pnpm test:coverage

      # 評価用サンドボックス（ADR-0024）が契約なしで完走するか。**利用者が最初に触る経路**で、
      # PRD §7 の先行指標「評価可能性（YES/NO）」の判定そのもの（ADR-0084）。
      # 2026-09-18 まで CI にもテストにも入っておらず、**壊れても利用者が試すまで分からない**
      # 状態だった（実際にはそのとき緑だったが、緑であることを誰も確かめていなかった）。
      - name: Sandbox (offline, no contract)
        if: steps.changes.outputs.code == 'true'
        run: pnpm sandbox

      - name: Build
        if: steps.changes.outputs.code == 'true'
        run: pnpm build

      # 公開物の正当性（exports/files/types）と型解決（ADR-0027）。build 後に検査。
      # attw は `require` 条件が ESM に解決される形を FalseCJS と報告するので ignore している
      # （Node の require(esm) を織り込まず「dynamic import only」と判定するため）。publint も
      # 同じ形に warning を出すが exit 0（`.d.cts` は default import の interop が曖昧、の指摘。
      # 公開 API に default export が無いので実害は無い）。**静的判定を落とした分は次のステップで
      # 実際に叩いて埋める**（ADR-0082）。
      - name: Check publish (publint + attw)
        if: steps.changes.outputs.code == 'true'
        run: pnpm check:publish

      # CJS の入口を**実行して**確かめる（ADR-0082）。`require()` が通ること・`instanceof` が
      # ESM/CJS をまたぐこと・CJS の TS 利用者（module: node16）がコンパイルできること。
      # 0.18.0 まで CJS から入口が無かったのは、誰も叩いていなかったから。
      - name: Check CJS entry (require + node16 types)
        if: steps.changes.outputs.code == 'true'
        run: pnpm check:cjs

      # 公開依存（prod）の high 以上のみブロックする狭いゲート（フェイルセーフ）。
      - name: Audit (production deps, high+)
        if: steps.changes.outputs.code == 'true'
        run: pnpm audit --prod --audit-level high
