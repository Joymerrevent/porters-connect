name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

# 同一 ref で進行中の run は新しい push で打ち切る（ランナー節約・フィードバック高速化）
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 単調増加検証（ADR-0031）の baseline は直近の git タグ。既定の checkout は
          # タグを取得しないため明示取得する（shallow のまま tag refs だけ足す＝軽い）。
          fetch-tags: true

      # 変更が docs だけか判定（ADR-0028）。docs-only は重い検査を skip し lint/format だけにする。
      # 必須チェックなので job 自体は常に走り報告する（paths-ignore は使わない＝"Expected" 詰み回避）。
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: changes
        with:
          # "every": ファイルが全パターンを満たすときだけ該当（= 非 md かつ 非 docs）。
          # 既定の "some" だと否定パターンの OR で全ファイルが該当し常に true になるため必須。
          predicate-quantifier: "every"
          filters: |
            code:
              - "!**/*.md"
              - "!docs/**"

      # pnpm を先に入れる（setup-node の cache: pnpm が pnpm を要求するため）
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # 整形・lint は docs PR でも常時（docs-only の「lint だけ」はここ）
      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      # リリース連動文書の整合チェック（ADR-0027）。常時実行（README/CHANGELOG 変更も拾うため）。
      - name: Release invariants
        run: pnpm check:release

      # 索引（docs/adr/index.md ほか）と各本文のメタ行の突合（ADR-0053 / ADR-0052）。
      # 索引の更新は docs-only PR で起きるため、code フィルタ配下に置かず**常時実行**する
      # （ここを間違えると検査が一度も走らない）。
      - name: Doc index
        run: pnpm check:index

      # docs/api（TypeDoc の生成物）が今のソースと一致しているかの検査（ADR-0068 決定3）。
      # 生成物をリポジトリに置く方式の値打ちは「公開 API を変えるとリファレンスの差分が PR に
      # 出る」ことで、生成し忘れるとその値打ちが消える。JSDoc だけの変更でも差分が出るので
      # code フィルタ配下に置かず**常時実行**する（src と docs のどちらの変更でも走らせる）。
      - name: API reference
        run: pnpm check:api

      # シェルの `$var` に全角文字が吸われる箇所の検出（.sh と .github/workflows の YAML）。
      # 日本語メッセージで自然に生まれ、しかも異常報告の行に出るため「報告せず死ぬ」形で
      # 壊れる（実際に 2 度発生した）。検査対象は docs 配下やワークフローにも散るので
      # code フィルタ配下に入れず**常時実行**する。
      - name: Shell identifiers
        run: pnpm check:shell

      # シェルの静的解析。上の check:shell（全角の吸い込み）とは別物で、こちらは
      # クォート漏れ・未定義参照・パイプの終了ステータスなど一般的な bash の壊れ方を見る。
      # .sh は docs-only の PR でも変わりうるので code フィルタ配下に置かず**常時実行**する。
      # 手元で回すなら: git ls-files -z '*.sh' | xargs -0 pnpm dlx shellcheck -x -s bash -S warning
      # （npm の shellcheck ラッパーは版を指定してもバイナリは最新を取ってくるので、
      #   手元とランナーで版が違いうる。下の理由により、それでよい）
      - name: Shellcheck
        run: |
          # shellcheck は ubuntu ランナーに同梱されている（ubuntu-latest = Ubuntu 24.04、
          # 同梱は 0.9.0。2026-09-06 に runner-images の同梱一覧と、その 0.9.0 を実際に
          # 落として全 .sh に当てた結果の両方で確認済み）。
          # 版はイメージ更新で上がりうるが**固定しない** — 固定したいのは検査の下限であって
          # 特定の版ではない。新しい shellcheck は検査が増えるだけなので下限は下がらず、
          # 版が上がって赤くなったならそれは本物の指摘。
          # 無いときに黙って飛ばすと「検査したつもりで一度も走っていない」状態になるので、
          # 存在しなければ明示的に落とす。
          command -v shellcheck > /dev/null || {
            echo "::error::shellcheck が見つかりません（ランナー同梱物の変更を疑うこと）。" >&2
            exit 1
          }
          files=$(git ls-files '*.sh')
          if [ -z "${files}" ]; then
            echo "::error::検査対象の .sh が 1 つも見つかりません。検査が空振りしています。" >&2
            exit 1
          fi
          shellcheck --version
          # -x で source 先まで解決する。info（SC2016 等）は落とさず warning 以上を見る。
          # NUL 区切りで渡す。改行区切りだと空白を含むファイル名で単語分割される
          # （`-0` は GNU / BSD どちらの xargs にもあるので手元でも同じ形で回せる）。
          git ls-files -z '*.sh' | xargs -0 shellcheck -x -s bash -S warning

      # 以下はコード変更時のみ（docs-only は skip）
      - name: Typecheck
        if: steps.changes.outputs.code == 'true'
        run: pnpm typecheck

      - name: Test (coverage)
        if: steps.changes.outputs.code == 'true'
        run: pnpm test:coverage

      - name: Build
        if: steps.changes.outputs.code == 'true'
        run: pnpm build

      # 公開物の正当性（exports/files/types）と型解決（ADR-0027）。build 後に検査。
      - name: Check publish (publint + attw)
        if: steps.changes.outputs.code == 'true'
        run: pnpm check:publish

      # 公開依存（prod）の high 以上のみブロックする狭いゲート（フェイルセーフ）。
      - name: Audit (production deps, high+)
        if: steps.changes.outputs.code == 'true'
        run: pnpm audit --prod --audit-level high
