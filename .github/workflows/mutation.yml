name: Mutation

# ミューテーションテスト（ADR-0015）の CI 強制。
# PR / push / nightly のすべてで**フル run**（約 11 分）。以前は PR を incremental で回していたが、
# Stryker の incremental は **static mutant（モジュール読み込み時に評価される定数）の "Survived" を、
# その行を変えるか --force を掛けるまで再利用し続ける**（static には per-test の coverage が無く、
# 「cover するテストが増えた」と判定されることが無い — core の incremental-differ）。
# break 100 と組み合わせると、static の穴をテストで塞いだ PR が必ず落ちる＝ゲートとして成立しない
# ので、差分再評価はやめた（ADR-0015 の訂正・2026-09-22）。
# break 閾値（stryker.config.json）を下回ると job が落ちる＝テスト品質の回帰を止める。
# docs-only の PR/push は stryker を skip（必須チェックなので job は走り報告する・ADR-0028）。
# リリースの流れの PR（release/* → main・main → develop）は develop と比べ、版番号と文書だけの
# 違いなら skip する（コードは develop で検査済み・ADR-0028 の訂正 2026-09-23）。
on:
  pull_request:
  push:
    branches: [main, develop]
  schedule:
    - cron: "0 18 * * *" # 毎日 03:00 JST 相当（既定ブランチ上で実行される）: 依存やランタイム側のドリフト検知
  workflow_dispatch:

permissions:
  contents: read

# 同一 ref で進行中の run は新しい push で打ち切る（ランナー節約・フィードバック高速化）
concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutation:
    name: stryker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 変更が docs だけか判定（PR/push のみ）。docs-only は以降の重い処理を skip する（ADR-0028）。
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: changes
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        with:
          predicate-quantifier: "every" # 非 md かつ 非 docs のときだけ該当（ci.yml と同方針）
          filters: |
            code:
              - "!**/*.md"
              - "!docs/**"

      # リリースの流れの PR では、PR のマージ結果を develop と比べる（ADR-0028 の訂正）。
      # base（main）との差分だと develop で検査済みのコードがすべて「変更」に見え、back-merge は
      # main への push と同じコミットを検査することになる。違いが版番号と文書だけなら skip する。
      # 判定に失敗したらスクリプトが bookkeeping=false を返す＝フル run（skip しない側に倒す）。
      # Node はランナー同梱のものを使う（スクリプトは node: の標準モジュールだけ）。
      - name: Release flow (compare with develop)
        id: release
        if: >-
          github.event_name == 'pull_request' && steps.changes.outputs.code == 'true' &&
          ((github.base_ref == 'main' && startsWith(github.head_ref, 'release/')) ||
          (github.base_ref == 'develop' && github.head_ref == 'main'))
        run: |
          git fetch --no-tags --depth=1 origin develop || echo "::warning::develop を取得できませんでした（判定はフル run に倒れます）"
          node scripts/detect-release-bookkeeping.mjs origin/develop HEAD >> "${GITHUB_OUTPUT}"

      # 以降の重い処理を走らせるか。条件を 1 箇所にまとめる（各ステップに同じ式を並べない）。
      #   nightly / 手動 → 常に走る
      #   PR / push     → コードの変更があり、かつリリースの流れで develop と同じでないとき
      - name: Decide
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          CODE: ${{ steps.changes.outputs.code }}
          BOOKKEEPING: ${{ steps.release.outputs.bookkeeping }}
        run: |
          if [ "${EVENT}" = "schedule" ] || [ "${EVENT}" = "workflow_dispatch" ]; then
            run=true
          elif [ "${CODE}" != "true" ]; then
            run=false
            echo "コードの変更が無いので stryker を skip します（docs-only）"
          elif [ "${BOOKKEEPING}" = "true" ]; then
            run=false
            echo "develop との違いが版番号と文書だけなので stryker を skip します（コードは develop で検査済み）"
          else
            run=true
          fi
          echo "run=${run}" >> "${GITHUB_OUTPUT}"

      # pnpm を先に入れる（setup-node の cache: pnpm が pnpm を要求するため）。
      # **skip するとき（docs-only・リリースの流れで develop と同じ）は Node ごと skip する**: install しないと
      # pnpm store が作られず、setup-node の post 段階が「保存対象のパスが無い」で job を失敗させるため
      # （下記 Install と同条件）。
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.gate.outputs.run == 'true'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.gate.outputs.run == 'true'
        with:
          node-version-file: .node-version
          cache: pnpm

      # stryker を実行するときだけ install
      - name: Install
        if: steps.gate.outputs.run == 'true'
        run: pnpm install --frozen-lockfile

      # フル run。PR / push はコード変更時のみ（docs-only とリリースの流れの版番号だけは上の判定で skip）、
      # nightly / 手動は常に。
      # incremental のキャッシュ（reports/stryker-incremental.json）は使わない（冒頭のコメント）。
      - name: Mutation (full)
        if: steps.gate.outputs.run == 'true'
        run: pnpm exec stryker run
