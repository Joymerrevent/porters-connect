name: Scorecard

# OpenSSF Scorecard によるサプライチェーン健全性スキャン（公式スターター準拠）。
# 既定ブランチ（main）に対して定期・push・ブランチ保護変更で走らせ、結果を
# code scanning（Security タブ）へ SARIF で上げつつ OpenSSF へ公開する（バッジ用）。
# publish_results は「公開リポジトリのスコア＝公開メタデータ」のみを送信し、機微情報は含まない。
#
# 注意: 既定ブランチ以外／fork PR では publish 用の id-token が無く失敗するため、
#       PR トリガは付けない（＝必須チェックにもしない）。
on:
  branch_protection_rule: # ブランチ保護ルールの変更で再評価
  schedule:
    - cron: "27 2 * * 1" # 毎週月曜 02:27 UTC（codeql の 03:23 と時間をずらす）
  push:
    branches: [main]

# 既定は読み取りのみ。書き込みは job で必要な分だけ付与する（codeql.yml と同方針）。
permissions:
  contents: read

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: scorecard
    runs-on: ubuntu-latest
    permissions:
      security-events: write # SARIF を code scanning にアップロードするのに必要
      id-token: write # publish_results（OpenSSF への公開）の OIDC に必要
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # 公開リポジトリのスコアを OpenSSF に公開（README バッジ・REST API 用）。
          publish_results: true

      # SARIF を成果物として保持（デバッグ・監査用。短期保存で十分）。
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      # code scanning（Security タブ）へ取り込み、指摘を PR/コードと紐付ける。
      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          sarif_file: results.sarif
