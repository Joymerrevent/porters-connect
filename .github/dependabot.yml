# Dependabot 設定（version updates）。npm 依存と GitHub Actions の参照バージョンを
# 定期的に PR 化して新しく保つ。脆弱性の自動修正 PR（security updates）は
# リポジトリ設定のトグルで有効化しており、これと併用して穴を塞ぐ。
version: 2
updates:
  # npm 依存。minor/patch は dev/prod ごとにまとめて PR ノイズを抑える（major は個別 PR）。
  - package-ecosystem: "npm"
    directory: "/"
    # 依存更新 PR は開発統合ブランチ develop に向ける（git-flow。main は release で受ける）。
    target-branch: "develop"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    # サプライチェーン対策の熟成期間。公開直後の版は PR にせず、レジストリから
    # 悪性リリースが発見・削除されるまでの時間を稼ぐ（防御の本体は「時間」）。
    # cooldown が効くのは version updates だけで、security updates は素通りする＝
    # 「新しいだけの更新は待つ／穴が空いたら即塞ぐ」。待つことで穴は開かない。
    # pnpm-workspace.yaml の minimumReleaseAge と日数を揃えること（下記参照）。
    cooldown:
      default-days: 7
      # major はランタイム要件や破壊的変更を伴い、追従コストも切り戻しコストも
      # 大きい。エコシステム側の様子見が済んでから受ける。
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 7
    groups:
      dev-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
      prod-dependencies:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"

  # GitHub Actions のバージョン更新（ランナー強制移行に先回り）。
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    # npm 側と同じ熟成期間。アクションは SHA ピンで参照しているが、ピンを付け替える
    # のは Dependabot 自身なので、タグが指す先をすげ替える攻撃には SHA ピンだけでは
    # 足りない。github-actions エコシステムは semver 別の指定に非対応のため
    # default-days のみ（major も 7 日で受ける）。
    cooldown:
      default-days: 7
    # 複数アクションの更新を 1 つの PR にまとめてノイズを減らす。
    # ただし major はランタイム変更（Node バージョン）や入力の破壊的変更を伴うため
    # グループから外して個別 PR で受ける（npm 側と同方針）。まとめると「1 件だけ
    # 懸念がある」ときにグループ全体を止めるか丸ごと通すかの二択になり、切り戻しの
    # 単位も大きくなる＝壊れたときに安全側へ倒せない。
    groups:
      actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    # コミットメッセージを conventional commits（ci プレフィックス）に揃える
    commit-message:
      prefix: "ci"
